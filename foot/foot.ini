# Font
font=Lilex Nerd Font:pixelsize=15
pad=4x4
dpi-aware=no
term=foot-extra

# Avoid gaps when resizing in floating mode
resize-by-cells=no

[scrollback]
lines=1500

[key-bindings]
scrollback-up-page=Control+Shift+b
scrollback-up-half-page=Control+Shift+k
scrollback-up-line=Control+Shift+y
scrollback-down-page=Control+Shift+f
scrollback-down-half-page=Control+Shift+j
scrollback-down-line=Control+Shift+e

## Colorscheme: Kanagawa-dragon
## https://github.com/rebelot/kanagawa.nvim
